# Runs the four QA suites on every push and pull request.
#
# Every suite starts the real application and drives it, so the job builds the
# app first. None of them need an Anthropic key or a Google account: the
# generator falls back when no key is present, and the Google suites talk to
# scripts/mock-google.mjs.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the browser suites
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Mobile suite
        run: npm run test:mobile
      - name: Design engine suite
        run: npm run test:design
      - name: Menu data suite
        run: npm run test:menu
      - name: Desktop packaging suite
        run: npm run test:desktop
      - name: First-launch setup suite
        run: npm run test:setup
      - name: Gemini suite
        run: npm run test:gemini
      - name: Design systems suite
        run: npm run test:design-systems

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore

  shell:
    name: Desktop shell compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The installer is built on Windows, but the shell is the same Rust code
      # on either platform, so checking it here catches an invalid capability
      # or a plugin API change on every push rather than at release time.
      - name: Install the Linux webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      - name: cargo check
        working-directory: desktop/tauri/src-tauri
        run: cargo check --locked
