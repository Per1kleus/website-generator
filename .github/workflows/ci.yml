# Runs every QA suite on every push and pull request.
#
# The suites fall into three groups and the difference is what broke this
# workflow for a long time: three of them drive a browser against an
# application that has to be running already, and nothing here started one. The
# mobile suite was the first step, so it failed on connection refused and every
# suite after it never ran at all.
#
# So the job now starts the built application on port 3100, waits for it to
# answer, and stops it at the end. None of the suites need a Gemini key or a
# Google account: the generator falls back when no key is present, and the
# hosted-AI and Google suites drive their own stubs.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the browser suites
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # --- suites that need nothing running ------------------------------
      - name: Site suite
        run: npm run test:site
      - name: Design systems suite
        run: npm run test:design-systems

      # --- suites that start their own server ----------------------------
      - name: Design engine suite
        run: npm run test:design
      - name: Menu data suite
        run: npm run test:menu
      - name: Gemini suite
        run: npm run test:gemini
      - name: First-launch setup suite
        run: npm run test:setup
      - name: Desktop packaging suite
        run: npm run test:desktop
      - name: GitHub Pages suite
        run: npm run test:github
      - name: Backup and recovery suite
        run: npm run test:backup
      - name: Client Google connection suite
        run: npm run test:connect

      # --- suites that drive a running application -----------------------
      #
      # Its data directory is a scratch one, so a suite that creates projects
      # never writes into the checkout. Health is polled rather than slept on:
      # a fixed wait is either too short on a slow runner or wasted on a fast
      # one, and a server that failed to start must fail here rather than
      # thirty seconds later as a connection error inside a test.
      - name: Start the application on port 3100
        run: |
          mkdir -p "$RUNNER_TEMP/wg-data"
          WG_DATA_DIR="$RUNNER_TEMP/wg-data" npx next start -p 3100 \
            > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then
              echo "the application is up"
              exit 0
            fi
            sleep 2
          done
          echo "the application did not start:"
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Preview suite
        run: npm run test:preview
      - name: Studio suite
        run: npm run test:studio
      - name: Mobile suite
        run: npm run test:mobile

      - name: Stop the application
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || true

      - name: Upload the application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: ${{ runner.temp }}/app.log
          if-no-files-found: ignore

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore

  shell:
    name: Desktop shell compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The installer is built on Windows, but the shell is the same Rust code
      # on either platform, so checking it here catches an invalid capability
      # or a plugin API change on every push rather than at release time.
      - name: Install the Linux webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      # tauri-build refuses to configure an app whose declared resources are
      # missing, and three of them are staged by the packaging script rather
      # than committed: the Node runtime (120 MB), npm, and the built server.
      # Version control is right not to carry any of them, so a fresh checkout
      # cannot `cargo check` at all without standing something in their place.
      # Empty is enough — this job compiles the shell, it does not bundle or
      # run it — and it was verified by hiding the real ones and checking.
      - name: Placeholders for the staged resources
        run: |
          mkdir -p desktop/tauri/src-tauri/binaries desktop/tauri/npm .next/standalone
          : > desktop/tauri/src-tauri/binaries/wg-node-x86_64-unknown-linux-gnu

      - name: cargo check
        working-directory: desktop/tauri/src-tauri
        run: cargo check --locked
